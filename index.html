<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wru now — ศูนย์แจ้งของหาย</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- โลโก้ (กด 3 ครั้งติดกันเพื่อเข้าโหมดแอดมินลับ) -->
            <div onclick="secretLogoClick()" class="flex items-center gap-2 cursor-pointer select-none">
                <span class="w-3 h-3 rounded-full bg-black inline-block"></span>
                <h1 class="text-xl font-bold tracking-wider uppercase text-slate-900">wru now</h1>
            </div>
            
            <div>
                <!-- ปุ่ม Google Form ความคิดเห็น -->
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSc4XlDQSX0KquNnDCjzeEKOW-9M5rVdXi4gB0YB3Tqw9KW6Zw/viewform?usp=dialog" target="_blank" class="text-xs sm:text-sm font-medium px-4 py-2 rounded-full border border-slate-300 hover:bg-slate-100 transition-all flex items-center gap-1">
                    💬 ส่งความคิดเห็น
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Admin Panel (ซ่อนอยู่) -->
        <section id="adminPanel" class="hidden mb-10 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <div class="flex justify-between items-center mb-6 border-b pb-3 border-slate-100">
                <h2 class="text-lg font-semibold text-slate-900 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span> แผงควบคุมแอดมิน (ลงประกาศใหม่)
                </h2>
                <span class="text-xs text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full">Admin Active</span>
            </div>
            
            <form id="postForm" onsubmit="createPost(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อของที่หาย / รายละเอียด *</label>
                        <input type="text" id="itemName" required placeholder="เช่น กระเป๋าสตางค์สีดำ" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-slate-800 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">สถานะของ *</label>
                        <select id="itemStatus" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-slate-800 transition bg-white">
                            <option value="อยู่ที่สภานักเรียน">อยู่ที่สภา</option>
                            <option value="กำลังตามหา owner">กำลังตามหาเจ้าของ</option>
                            <option value="มีคนรับคืนไปแล้ว">มีคนรับไปแล้ว</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">ชื่อผู้แจ้ง *</label>
                        <input type="text" id="reporterName" required placeholder="ชื่อคนแจ้ง" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-slate-800 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">คอนแทคผู้แจ้ง *</label>
                        <input type="text" id="contactInfo" required placeholder="เช่น IG / โทรศัพท์" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-slate-800 transition">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-medium text-slate-600 mb-1">คอนแทคผู้รับคืน / ผู้มารับ (ระบุภายหลังได้)</label>
                        <input type="text" id="receiverContact" placeholder="เช่น นาย B (IG: @receiver_b) หรือระบุ '-'" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-slate-800 transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">รูปภาพของที่พบ *</label>
                    <input type="file" id="itemImage" accept="image/*" required class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer">
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full md:w-auto px-6 py-2.5 bg-slate-900 text-white text-sm font-medium rounded-xl hover:bg-slate-800 transition">
                        + โพสต์ลงประกาศ
                    </button>
                </div>
            </form>
        </section>

        <!-- Dynamic Items Grid -->
        <div id="postsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3 text-xl">🔍</div>
            <p class="text-slate-500 text-sm font-light">ยังไม่มีรายการประกาศในขณะนี้</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 bg-white py-6 mt-12">
        <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2 text-xs text-slate-400">
            <div>ID LINE : madambelly IG: FIOLABELLY</div>
            <button id="adminToggleBtn" onclick="toggleAdminMode()" class="text-slate-300 hover:text-slate-500 transition text-[11px] focus:outline-none">
                • 
            </button>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const ADMIN_PASSWORD = "fiolabelly"; // รหัสผ่านสำหรับโหมดแอดมินนะคะ
        let isAdmin = false;
        let logoClickCount = 0;
        let logoClickTimer;

        let posts = JSON.parse(localStorage.getItem('wrunow_posts')) || [];

        document.addEventListener("DOMContentLoaded", () => {
            renderPosts();
        });

        function secretLogoClick() {
            logoClickCount++;
            clearTimeout(logoClickTimer);
            if (logoClickCount === 3) {
                toggleAdminMode();
                logoClickCount = 0;
            } else {
                logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 1000);
            }
        }

        function toggleAdminMode() {
            if (!isAdmin) {
                const password = prompt("กรุณากรอกรหัสผ่านผู้ดูแลระบบ:");
                if (password === ADMIN_PASSWORD) {
                    isAdmin = true;
                    document.getElementById('adminPanel').classList.remove('hidden');
                    document.getElementById('adminToggleBtn').innerText = "• ออกจากโหมดแอดมิน";
                    document.getElementById('adminToggleBtn').classList.replace('text-slate-300', 'text-red-500');
                    renderPosts();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else if (password !== null) {
                    alert("รหัสผ่านไม่ถูกต้อง");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminPanel').classList.add('hidden');
                document.getElementById('adminToggleBtn').innerText = "• Manager Access";
                document.getElementById('adminToggleBtn').classList.replace('text-red-500', 'text-slate-300');
                renderPosts();
            }
        }

        function createPost(e) {
            e.preventDefault();
            const fileInput = document.getElementById('itemImage');
            const file = fileInput.files[0];

            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const receiverInput = document.getElementById('receiverContact').value.trim();
                const newPost = {
                    id: Date.now(),
                    name: document.getElementById('itemName').value,
                    status: document.getElementById('itemStatus').value,
                    reporter: document.getElementById('reporterName').value,
                    contact: document.getElementById('contactInfo').value,
                    receiver: receiverInput || "-",
                    image: e.target.result,
                    date: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })
                };

                posts.unshift(newPost);
                saveAndRender();
                document.getElementById('postForm').reset();
            };
            reader.readAsDataURL(file);
        }

        function deletePost(id) {
            if (confirm("คุณต้องการลบโพสต์นี้ใช่หรือไม่?")) {
                posts = posts.filter(post => post.id !== id);
                saveAndRender();
            }
        }

        function updateStatus(id, newStatus) {
            const post = posts.find(p => p.id === id);
            if (post) {
                post.status = newStatus;
                saveAndRender();
            }
        }

        
        function editReceiver(id) {
            const post = posts.find(p => p.id === id);
            if (post) {
                const newReceiver = prompt("ระบุชื่อ / คอนแทคผู้รับคืน:", post.receiver !== '-' ? post.receiver : '');
                if (newReceiver !== null) {
                    post.receiver = newReceiver.trim() || '-';
                    saveAndRender();
                }
            }
        }

        function saveAndRender() {
            localStorage.setItem('wrunow_posts', JSON.stringify(posts));
            renderPosts();
        }

        function getStatusStyle(status) {
            if (status.includes('สภา')) {
                return 'bg-indigo-50 text-indigo-700 border-indigo-200';
            } else if (status.includes('รับไปแล้ว')) {
                return 'bg-emerald-50 text-emerald-700 border-emerald-200';
            } else {
                return 'bg-amber-50 text-amber-700 border-amber-200';
            }
        }

        function renderPosts() {
            const container = document.getElementById('postsGrid');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            if (posts.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            posts.forEach(post => {
                const statusStyle = getStatusStyle(post.status);
                const hasReceiver = post.receiver && post.receiver !== '-';
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <div class="relative w-full h-52 bg-slate-100 overflow-hidden">
                            <img src="${post.image}" alt="${post.name}" class="w-full h-full object-cover">
                            <span class="absolute top-3 right-3 text-[11px] font-medium px-3 py-1 rounded-full border backdrop-blur-md ${statusStyle}">
                                ${post.status}
                            </span>
                        </div>
                        
                        <div class="p-5">
                            <div class="text-[11px] text-slate-400 mb-1">แจ้งเมื่อ: ${post.date}</div>
                            <h3 class="text-base font-semibold text-slate-900 mb-4 line-clamp-2">${post.name}</h3>
                            
                            <div class="space-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-3">
                                <p><span class="text-slate-400">ผู้แจ้ง:</span> ${post.reporter}</p>
                                <p><span class="text-slate-400">คอนแทคผู้แจ้ง:</span> <span class="font-medium text-slate-800">${post.contact}</span></p>
                                <p class="pt-1"><span class="text-slate-400">ผู้รับคืน:</span> <span class="font-medium ${hasReceiver ? 'text-emerald-700' : 'text-slate-400'}">${hasReceiver ? post.receiver : 'ยังไม่มีผู้มารับ'}</span></p>
                            </div>
                        </div>
                    </div>

                    ${isAdmin ? `
                        <div class="px-5 pb-4 pt-2 border-t border-slate-100 bg-slate-50 flex flex-col gap-2">
                            <div class="flex items-center justify-between gap-2">
                                <select onchange="updateStatus(${post.id}, this.value)" class="text-xs bg-white border border-slate-300 rounded-lg px-2 py-1 focus:outline-none">
                                    <option value="อยู่ที่สภานักเรียน" ${post.status.includes('สภา') ? 'selected' : ''}>อยู่ที่สภา</option>
                                    <option value="กำลังตามหา owner" ${post.status.includes('ตามหา') ? 'selected' : ''}>กำลังตามหา</option>
                                    <option value="มีคนรับคืนไปแล้ว" ${post.status.includes('รับไปแล้ว') ? 'selected' : ''}>มีคนรับไปแล้ว</option>
                                </select>
                                <button onclick="deletePost(${post.id})" class="text-xs text-red-600 hover:text-red-800 font-medium px-2 py-1">
                                    ลบโพสต์
                                </button>
                            </div>
                            <button onclick="editReceiver(${post.id})" class="w-full text-center text-xs text-slate-600 hover:text-slate-900 bg-white border border-slate-200 rounded-lg py-1">
                                ✏️ แก้ไขคอนแทคผู้รับคืน
                            </button>
                        </div>
                    ` : ''}
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
